<style>

.ib:disabled{opacity:.35;pointer-events:none}

<div class="szg">${SZ.map((n,i)=>`<button class="szc${n==now?' on':''}" data-z="${n}"><i style="width:${14+n/mx*36}px;height:${14+n/mx*36}px"></i>${m?n+'×'+n:'×'+n/624}<small>${NM[i]}</small></button>`).join('')}</div>
<div class="gh"><h3>Шаблоны <small>${m?'пиксели':'рисунок'}</small></h3><div class="gb"><button class="btn s" id="stoff">Без шаблона</button><button class="btn" id="stmk">Из рисунка</button></div></div>
<div class="gg tg">${L.map(t=>`<figure class="card"><button class="stp${cur==t.k?' on':''}" data-k="${t.k}"><canvas width="360" height="360" data-k="${t.k}"></canvas></button><b>${t.t}</b>${tl(t)}${t.del?`<div class="ca"><button data-del="${t.k}">Удалить</button></div>`:''}</figure>`).join('')}</div>
<p class="mu">Большой холст двигай двумя пальцами и приближай щипком. Сложные шаблоны (★) сами ставят холст не меньше 64×64.</p>`;
$('#s-nw').querySelectorAll('canvas').forEach(c=>gdraw(c.getContext('2d'),c.dataset.k,S.mode,1))}
function mkStencil(){const D=S.mode=='pixel'?Object.keys(P).map(Number):ST.filter(t=>!t.e).map(t=>{const a=[];for(let i=0;i<t.p.length;i+=2)a.push([t.p[i],t.p[i+1]]);return{p:dp(a,2).flat()}});
if(!D.length)return toast('Сначала нарисуй контур');STL.unshift({id:'c'+Date.now().toString(36),m:S.mode,t:'Мой '+(STL.filter(t=>t.m==S.mode).length+1),D,n:dim()});if(!stSave())return STL.shift();toast('Трафарет сохранён');sheetNew()}
function setSize(n){S[S.mode=='pixel'?'pn':'fw']=n;save();load();sheetNew()}
function pickT(k){const big=S.mode=='pixel'&&isB(k)&&+k>5&&S.pn<48;if(big){S.pn=64;toast('Сложный шаблон: холст 64×64')}setSt(k);if(k!='0')S.hint=true;save();if(big)load();else{guide();ui();resetView()}closeS()}
$('#s-nw').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.m){setMode(b.dataset.m);return sheetNew()}if(b.dataset.z)return setSize(+b.dataset.z);
if(b.id=='stmk')return mkStencil();
if(b.dataset.del){STL=STL.filter(t=>t.id!=b.dataset.del);stSave();if(curSt()==b.dataset.del)setSt('0');guide();return sheetNew()}
const k=b.id=='stoff'?'0':b.dataset.k;if(k!=null)pickT(k)};
/* ══ 9. ГОРЯЧИЕ КЛАВИШИ И ЗАПУСК ══ */
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
if(c&&k=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(c&&k=='y'){e.preventDefault();redo()}
else if(!c&&!e.altKey){const t={b:'brush',e:'eraser',f:'fill',i:'pick',h:'hand'}[k];if(t)applyTool(t,e.target)}});
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
load();openIncoming();
</script></body></html>
